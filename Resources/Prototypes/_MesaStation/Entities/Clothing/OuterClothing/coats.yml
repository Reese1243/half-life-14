#Mesa Station Coats

- type: entity
  abstract: true
  parent: [ ClothingOuterArmorBase, ClothingOuterStorageBase ]
  id: ClothingOuterArmorBlackMesaHOS
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.6
        Heat: 0.7
        Caustic: 0.75 # not the full 90% from ss13 because of the head

- type: entity
  parent: [BaseSecurityCommandContraband, ClothingOuterArmorBlackMesaHOS]
  id: ClothingOuterCoatBlackMesaHOSCoat
  name: Black Mesa Security Chief's Coat
  description: A comfortable bomber jacket worn by the head of security of Black Mesa. It has been reinforced with an experimental kevlar weave while maintaining a stylish look.
  components:
  - type: Sprite
    sprite: _MesaStation/Clothing/OuterClothing/Coats/bmsec_hoscoat.rsi
  - type: Clothing
    sprite: _MesaStation/Clothing/OuterClothing/Coats/bmsec_hoscoat.rsi

- type: entity
  parent: [BaseSecurityCommandContraband, ClothingOuterArmorBlackMesaHOS]
  id: ClothingOuterCoatBlackMesaAdministratorCoat
  name: Black Mesa Administrator's Coat
  description: Brown tweed suit jacket to compliment the black cotton turtleneck. Erudite, elitist. It has been reinforced with an experimental kevlar weave.
  components:
  - type: Sprite
    sprite: _MesaStation/Clothing/OuterClothing/Coats/bm_admincoat.rsi
  - type: Clothing
    sprite: _MesaStation/Clothing/OuterClothing/Coats/bm_admincoat.rsi
