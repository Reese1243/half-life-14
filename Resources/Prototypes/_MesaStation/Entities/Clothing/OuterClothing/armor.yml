#MesaStation Armor
- type: entity
  parent: [ ClothingOuterArmorBase ]
  id: ClothingOuterBlackOps
  name: BlackOps bulletproof vest
  components:
  - type: Sprite
    sprite: _MesaStation/Clothing/OuterClothing/Armor/blackops_armor.rsi
  - type: Clothing
    equipDelay: 3  
    sprite: _MesaStation/Clothing/OuterClothing/Armor/blackops_armor.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.70
        Slash: 0.70
        Piercing: 0.70
        Heat: 0.80
  - type: ExplosionResistance
    damageCoefficient: 0.90

