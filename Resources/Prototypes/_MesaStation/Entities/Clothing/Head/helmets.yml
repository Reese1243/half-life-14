#Mesa Station Helmets

- type: entity
  parent: [ ClothingHeadHelmetArmoredBase ]
  id: ClothingHeadHelmetHecuGrunt
  name: HECU combat helmet
  description: A standard combat helmet issued to HECU marines.
  components:
    - type: Sprite
      sprite: _MesaStation/Clothing/Head/Helmets/hecuhelmetgrunt.rsi
    - type: Clothing
      sprite: _MesaStation/Clothing/Head/Helmets/hecuhelmetgrunt.rsi
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.9
          Slash: 0.9
          Piercing: 0.9
          Heat: 0.9
    - type: HideLayerClothing
      layers:
        Hair: HEAD

