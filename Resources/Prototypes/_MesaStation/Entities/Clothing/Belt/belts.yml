- type: entity
  parent: [ ClothingBeltStorageBase ]
  id: ClothingBeltHecuWebbing
  name: HECU webbing
  description: standard issue webbing for marines in the HECU
  components:
  - type: Sprite
    sprite: _MesaStation/Clothing/Belt/hecuwebbing.rsi
  - type: Clothing
    sprite: _MesaStation/Clothing/Belt/hecuwebbing.rsi

- type: entity
  parent: [ ClothingBeltStorageBase ]
  id: ClothingBeltBlackOpsWebbing
  name: BlackOps webbing
  description: standard issue webbing for CIA BlackOps
  components:
  - type: Sprite
    sprite: _MesaStation/Clothing/Belt/blackopswebvest.rsi
  - type: Clothing
    sprite: _MesaStation/Clothing/Belt/blackopswebvest.rsi

- type: entity
  parent: [ ClothingBeltStorageBase ]
  id: ClothingBeltBMEngineerHarness
  name: Black Mesa Engineer Harness
  description: Standard issue harness for Black Mesa engineers. It comes with a built in portable cell recharger for all your engineering needs.
  components:
  - type: Sprite
    sprite: _MesaStation/Clothing/Belt/engiharness.rsi
  - type: Clothing
    sprite: _MesaStation/Clothing/Belt/engiharness.rsi
  - type: Charger
    chargeRate: 10
    slotId: charger_slot
    portable: true
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag
  - type: ContainerContainer
    containers:
      charger_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      charger_slot:
        ejectOnInteract: false
        whitelist:
          tags:
          - PowerCell
          - PowerCellSmall
