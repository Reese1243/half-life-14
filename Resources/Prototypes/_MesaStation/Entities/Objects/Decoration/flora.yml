- type: entity
  id: BaseBushFlora
  name: bush
  description: Heavy as a really heavy thing.
  abstract: true
  components:
  - type: Sprite
    noRot: true
    sprite: Decals/Flora/flora_bushes.rsi
  - type: SpamEmitSound
    nextSound: 15
    minInterval: 20
    maxInterval: 30
    sound: 
      collection: FloraBushCollection
      params:
        volume: -8
        maxDistance: 5    
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 1000
        layer:
        - HalfWallLayer
        - Opaque
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 50
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]

- type: entity
  parent: BaseBushFlora
  id: floraBush1
  components:
  - type: Sprite
    layers:
    - state: busha1
