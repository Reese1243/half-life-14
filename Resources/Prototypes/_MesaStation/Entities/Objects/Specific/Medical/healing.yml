- type: entity
  name: small medkit
  description: Used to treat immediate medical attention. You still should use chargers to recover a lot of lose health.
  parent: BaseHealingItem
  id: Smallmedkit
  components:
  - type: Sprite
    sprite: _MesaStation/Objects/Specific/Medical/smallmedkit.rsi
    state: medkit
    scale: 0.7,0.7
  - type: Item
    sprite: _MesaStation/Objects/Specific/Medical/smallmedkit.rsi  
    inhandVisuals:
      left:
      - state: medkit-inhand-left
      right:
      - state: medkit-inhand-right
    size: Normal
  - type: Healing
    delay: 2
    damageContainers:
      - Biological
    damage:
      types:
        Blunt: -7
        Piercing: -10
        Slash: -7
        Heat: -5
        Cold: -5
        Shock: -5
        Poison: -10
        Radiation: -10
    modifyBloodLevel: 5
    bloodlossModifier: -10
    healingBeginSound:
      path: "/Audio/MesaStationMisc/smallmedkit1.ogg"
      params:
        volume: -100
    healingEndSound:
      path: "/Audio/MesaStationMisc/smallmedkit1.ogg"
      params:
        volume: -3
        variation: 0.125
