- type: entity
  name: small medkit
  description: Used to treat immediate medical attention. You still should use chargers to recover a lot of lose health.
  parent: BaseHealingItem
  id: Smallmedkit
  components:
  - type: Sprite
    sprite: _MesaStation/Objects/Specific/Medical/smallmedkit.rsi
    state: regenerative-mesh
    scale: 0.7,0.7
  - type: Item
    sprite: _MesaStation/Objects/Specific/Medical/smallmedkit.rsi  
    heldPrefix: regenerative-mesh
    size: Normal
  - type: Healing
    delay: 2
    damageContainers:
      - Biological
    damage:
      types:
        Blunt: -6
        Piercing: -10
        Slash: -6
        Heat: -4
        Cold: -4
        Shock: -4
        Poison: -10
        Radiation: -10
    modifyBloodLevel: -5
    healingBeginSound:
      path: "/Audio/MesaStationMisc/smallmedkit1.ogg"
      params:
        volume: -100
    healingEndSound:
      path: "/Audio/MesaStationMisc/smallmedkit1.ogg"
      params:
        volume: -3
        variation: 0.125
