- type: soundCollection
  id: GrenadeThrow
  files:
    - /Audio/MesaStationMisc/grunt_grenade_scream1.ogg
    - /Audio/MesaStationMisc/grunt_grenade_scream2.ogg

- type: entity
  name: Mk2 Grenade
  description: Grenade that creates a small but devastating explosion.
  parent: [VolatileGrenadeBase, TimerGrenadeBase, BaseSyndicateContraband]
  id: mk2grenade
  components:
  - type: Sprite
    sprite: _MesaStation/Objects/Weapons/Throwables/Grenades/mk2.rsi
    layers:
    - state: icon    
      map: ["enum.TriggerVisualLayers.Base"] 
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    explosionType: Default
    maxIntensity: 10
    intensitySlope: 3
    totalIntensity: 120 # about a ~4 tile radius
    canCreateVacuum: false
  - type: TimerTrigger
    beepSound:
      path: "/Audio/Weapons/MesaStationWeapons/CS_1.6/C4/c4_beep1.ogg"
      params:
        volume: 5
    initialBeepDelay: 0
    beepInterval: 2 # 2 beeps total (at 0 and 2)