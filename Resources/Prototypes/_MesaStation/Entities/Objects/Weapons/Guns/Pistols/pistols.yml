- type: entity
  name: glock
  parent: [BaseWeaponPistol, BaseSecurityContraband]
  id: WeaponPistolGlock
  description: A popular pick among law enforcement agencies everywhere. The Glock is standard issue for the Black Mesa security team.
  components:
  - type: Sprite
    sprite: _MesaStation/Objects/Weapons/Guns/Pistols/glock.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _MesaStation/Objects/Weapons/Guns/Pistols/glock.rsi
  - type: Item
    storedOffset: 0,-2
  - type: Gun
    fireRate: 5
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/MesaStationWeapons/Glock_HL/pl_gun3.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/MesaStationWeapons/Generic_Shared/reload3.ogg
    soundBoltClosed:
      path: /Audio/Weapons/MesaStationWeapons/CS_1.6/Generic_Shared/slideback1.ogg
    soundBoltOpened:
      path: /Audio/Weapons/MesaStationWeapons/Generic_Shared/reload3.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineGlock
        insertSound: /Audio/Weapons/MesaStationWeapons/Generic_Shared/reload1.ogg
        ejectSound: /Audio/Weapons/MesaStationWeapons/Generic_Shared/reload2.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineGlock
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgePistol
  - type: StealTarget
    stealGroup: OfficerHandgun
