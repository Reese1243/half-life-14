- type: entity
  name: crossbow
  parent: BaseWeaponRifle
  id: WeaponSniperCrossbow
  description: The Crossbow is a silent projectile weapon with a scope. Unlike most weapons, it can be fired underwater, making it especially useful against Ichthyosaurs.
  components:
  - type: Sprite
    sprite: _MesaStation/Objects/Weapons/Guns/Snipers/xbow.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _MesaStation/Objects/Weapons/Guns/Snipers/xbow.rsi
  - type: Item
    storedOffset: 0,-2
  - type: Gun
    fireRate: 0.5
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundEmpty: null  
    soundGunshot:
      path: /Audio/Weapons/MesaStationWeapons/Crossbow/xbow_fire1.ogg
  - type: ChamberMagazineAmmoProvider
    autoCycle: false
    soundRack:
      path: /Audio/Weapons/MesaStationWeapons/Crossbow/xbow_rack1.ogg
    soundBoltClosed: null
  - type: GunRequiresWield
  - type: UseDelay
    delay: 1.5
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineCrossbow
        insertSound: /Audio/Weapons/MesaStationWeapons/Crossbow/xbow_insert1.ogg
        ejectSound: /Audio/Weapons/MesaStationWeapons/Crossbow/xbow_reload1.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineLightRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgeMagnum
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 4
    pvsIncrease: 0.4