- type: entity
  name: M249 saw
  parent: [BaseWeaponRifle, BaseSecurityContraband]
  id: WeaponMachinegunM249
  description: A somewhat battered combat rifle of a design originating from old Earth. Favored by criminals, militias, and terrorists due to its famed reliability and easy-to-manufacture design. Feeds from .30 rifle magazines.
  components:
  - type: Sprite
    sprite: _MesaStation/Objects/Weapons/Guns/HMGs/m249.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _MesaStation/Objects/Weapons/Guns/HMGs/m249.rsi
  - type: Gun
    maxAngle: 80
    soundGunshot:
      collection: M249GunshotCollection
    fireRate: 7
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightMachineGun
        insertSound: /Audio/Weapons/MesaStationWeapons/OF_M249_SAW/saw_reload2.ogg
        ejectSound: /Audio/Weapons/MesaStationWeapons/OF_M249_SAW/saw_reload.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineLightRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: UseDelay
    delay: 1
  - type: GunRequiresWield
  - type: SpeedModifiedOnWield
    walkModifier: 0.6
    sprintModifier: 0.6
  - type: Appearance