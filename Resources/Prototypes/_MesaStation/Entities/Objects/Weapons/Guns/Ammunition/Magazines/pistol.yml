- type: entity
  parent: BaseMagazinePistol
  id: MagazineGlock
  name: glock magazine (9x19 parabellum)
  description: 17-round double-stack magazine for the glock. Has a window to monitor ammunition, if you were looking at it from the correct side.
  components:
  - type: Tag
    tags:
      - MagazineGlock
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgePistol
    capacity: 17
    proto: CartridgePistol
  - type: Sprite
    sprite: _MesaStation/Objects/Weapons/Guns/Ammunition/Magazine/Pistol/glock_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false

