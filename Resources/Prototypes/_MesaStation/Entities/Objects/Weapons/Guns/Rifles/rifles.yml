- type: entity
  name: M4 carbine
  parent: [BaseWeaponRifle, BaseSecurityContraband]
  id: WeaponRifleM4
  description: Standard issue army rifle, packs a punch with a .223 caliber projectile.
  components:
  - type: Sprite
    sprite: _MesaStation/Objects/Weapons/Guns/Rifles/M4A1.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _MesaStation/Objects/Weapons/Guns/Rifles/M4A1worn.rsi
  - type: GunWieldBonus
    minAngle: -24
    maxAngle: -26
  - type: Gun
    minAngle: 30
    maxAngle: 40
    fireRate: 6
    soundGunshot:
      collection: M4GunshotCollection
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineLightRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
