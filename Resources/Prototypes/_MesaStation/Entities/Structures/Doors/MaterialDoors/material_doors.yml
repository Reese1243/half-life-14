#Mesa Station Swing Doors

- type: entity
  parent: BaseMaterialDoorNavMap
  id: MesaMetalDoor1
  name: mesa metal door 1
  components:
  - type: Sprite
    sprite: _MesaStation/Structures/Doors/SwingDoors/mesametaldoor1.rsi
    snapCardinals: true
  - type: Door
    openSpriteState: open
    closedSpriteState: closed
    occludes: false
    canPry: false
    clickOpen: true
    closeTimeOne: 0
    closeTimeTwo: 0
    openTimeOne: 0
    openTimeTwo: 0
    openingAnimationTime: 0
    closingAnimationTime: 0
    openSound:
      path: /Audio/Effects/door_open.ogg
    closeSound:
      path: /Audio/Effects/door_close.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 3
            max: 5
  - type: Occluder
    enabled: false

