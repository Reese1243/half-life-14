# Mesa Station Walls

- type: entity
  parent: BaseWall
  id: BrickOfficeWall
  name: Office Brick Wall
  description: Dated brick walls fit for any office.
  components:
  - type: Sprite
    sprite: _MesaStation/Structures/Walls/MesaStation/brick_office.rsi
  - type: Icon
    sprite: Structures/Walls/MesaStation/brick_office.rsi
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: officebricks
    base: brick_office

